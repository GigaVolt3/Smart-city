name: civicai
description: "CivicAI — AI-Powered Smart Civic Grievance and Escalation System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# ─────────────────────────────────────────────────────────────────────────────
# Phase 1 — UI Foundation
# Kept minimal so `flutter pub get` succeeds regardless of network hiccups.
# Phase 3 packages (image_picker, geolocator, flutter_map, retrofit, etc.)
# will be added when the backend is connected.
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Date/time formatting
  intl: ^0.20.2

  # Shimmer loading effect
  shimmer: ^3.0.0

  # Unique IDs (for demo data)
  uuid: ^4.5.1

  # Icons
  cupertino_icons: ^1.0.8

  # ── Phase 3 additions (uncomment when backend is ready) ───────────────────
  # dio: ^5.8.0
  # flutter_secure_storage: ^9.2.4
  # shared_preferences: ^2.3.5
  # image_picker: ^1.1.2
  # cached_network_image: ^3.4.1
  # geolocator: ^13.0.4
  # flutter_map: ^8.1.1
  # latlong2: ^0.9.1
  # connectivity_plus: ^6.1.4
  # permission_handler: ^11.3.1
  # timeago: ^3.7.0
  # lottie: ^3.3.1
  # badges: ^3.1.2
  # package_info_plus: ^8.3.0
  # url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Phase 3 dev additions ──────────────────────────────────────────────────
  # build_runner: ^2.4.14
  # mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # fonts:
  #   Place Inter font files in assets/fonts/ and uncomment:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
