name: civicai
description: "CivicAI — AI-Powered Smart Civic Grievance and Escalation System"
publish_to: 'none'

version: 1.2.1+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.6.1

  # Networking & storage
  http: ^1.2.2
  shared_preferences: ^2.3.5

  # Media & links
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Maps
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Formatting
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
